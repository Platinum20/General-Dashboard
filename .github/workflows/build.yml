name: Build e release

# Ad ogni push su main l'app viene compilata.
# Se la versione in version.properties non ha ancora una release, ne viene pubblicata una
# con l'APK firmato e le note prese dalla sezione corrispondente di CHANGELOG.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Leggi versione
        id: version
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gia' presente: solo build di controllo."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepara chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nessuna chiave: build di controllo firmata con chiave di debug, nessuna release."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Compila APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        id: apk
        run: |
          OUT="General-Dashboard-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      - name: Pubblica release
        # Le release partono solo da main: le build lanciate a mano su altri rami servono solo da prova.
        if: steps.version.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Mancano i secret di firma (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): release non pubblicata. Senza una chiave fissa gli aggiornamenti non si installerebbero."
            exit 1
          fi
          VERSION="${{ steps.version.outputs.name }}"
          # Prende le righe tra "## <versione>" e l'intestazione successiva.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Nessuna nota per questa versione." > notes.md
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --title "Canvas $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
