name: Verifica accesso in WebView

# Su un emulatore Android vero: apre le pagine di accesso nella WebView dell'app, salva foto e testo.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/logincheck.yml"
      - "app/src/androidTest/**"

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Liste dei filtri pubblicità
        run: python3 scripts/update_filter_lists.py
      - name: Compila
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell dumpsys package com.google.android.webview | grep versionName | head -2
            adb shell am instrument -w -e class com.platinum20.dashboard.LoginPageCheck com.platinum20.dashboard.test/androidx.test.runner.AndroidJUnitRunner || true
            adb logcat -d -s LoginCheck:I chromium:* > logincheck.txt || true
            mkdir -p shots && adb pull /sdcard/Android/data/com.platinum20.dashboard/files/login-check shots/ || true
      - name: Risultato
        if: always()
        run: cat logincheck.txt || true
      - name: Pubblica le foto nel ramo screenshots
        if: always()
        run: |
          DEST="login-check/${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out" && cp -r shots logincheck.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          git fetch origin screenshots && git checkout -B screenshots origin/screenshots
          mkdir -p "$DEST" && cp -r "$RUNNER_TEMP/out/." "$DEST/"
          git add "$DEST" && git commit -m "Verifica accesso $DEST" >/dev/null && git push origin screenshots
