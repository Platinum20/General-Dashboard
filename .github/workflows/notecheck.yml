name: Verifica editor note

# Su un emulatore Android vero, con la tastiera vera: prova ogni interazione dell'editor delle note
# (NoteEditorDeviceCheck), foto dello schermo e resoconto nel ramo "screenshots" sotto note-check/<run>.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/notecheck.yml"
      - "app/src/androidTest/java/com/platinum20/dashboard/NoteEditorDeviceCheck.kt"

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Liste dei filtri pubblicità
        run: python3 scripts/update_filter_lists.py
      - name: Compila
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PallAbis=true --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            for p in RECORD_AUDIO READ_CALENDAR WRITE_CALENDAR POST_NOTIFICATIONS; do adb shell pm grant com.platinum20.dashboard android.permission.$p || true; done
            adb shell am instrument -w -e class com.platinum20.dashboard.NoteEditorDeviceCheck com.platinum20.dashboard.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt || true
            (cat instrument.txt; echo; echo ---- log; adb logcat -d -s NoteCheck:V AndroidRuntime:E) > notecheck.txt || true
            mkdir -p shots && adb pull /sdcard/Android/data/com.platinum20.dashboard/files/note-check shots/ || true
      - name: Risultato
        if: always()
        run: cat notecheck.txt || true
      - name: Pubblica nel ramo screenshots
        if: always()
        run: |
          DEST="note-check/${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out" && cp notecheck.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -r shots/. "$RUNNER_TEMP/out/" 2>/dev/null || true
          git fetch origin screenshots && git checkout -B screenshots origin/screenshots
          mkdir -p "$DEST" && cp -r "$RUNNER_TEMP/out/." "$DEST/"
          git add "$DEST" && git commit -m "Verifica editor note $DEST" >/dev/null
          for i in 1 2 3; do git push origin screenshots && break; git pull -q --rebase origin screenshots; done
