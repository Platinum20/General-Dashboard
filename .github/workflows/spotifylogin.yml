name: Verifica accesso Spotify

# Apre la pagina di accesso di Spotify con un browser da telefono e scrive cosa si vede.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/spotifylogin.yml"
      - ".github/scripts/spotify-login.js"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node .github/scripts/spotify-login.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotify-login
          path: "*.png"
